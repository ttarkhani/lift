name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg18
        env:
          POSTGRES_USER: lifts
          POSTGRES_PASSWORD: lifts
          POSTGRES_DB: lift_test
          TIMESCALEDB_TELEMETRY: "off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifts -d lift_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://lifts:lifts@localhost:5432/lift_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          APP_BASE_URL: http://localhost:3000
          EVENT_NAME: CI
          EVENT_TIMEZONE: America/Toronto
